name: Cache product packshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "products.json"
      - "product-image-sources.json"
      - "scripts/fetch-product-images.mjs"
      - ".github/workflows/cache-product-images.yml"

permissions:
  contents: write

jobs:
  cache-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download product images
        run: npm run cache-images

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/products

          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Cache local product packshots"
            git push
          fi
